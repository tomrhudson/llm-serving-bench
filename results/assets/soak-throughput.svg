<svg xmlns="http://www.w3.org/2000/svg" width="920" height="948" viewBox="0 0 920 948" role="img" aria-labelledby="title desc">
  <title id="title">20-minute concurrency-8 soak throughput</title>
  <desc id="desc">Aggregate output throughput for every published baseline.</desc>
  <style>
    :root { color-scheme: light dark; }
