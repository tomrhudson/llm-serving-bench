<svg xmlns="http://www.w3.org/2000/svg" width="920" height="266" viewBox="0 0 920 266" role="img" aria-labelledby="title desc">
  <title id="title">20-minute concurrency-8 soak throughput</title>
  <desc id="desc">Aggregate output throughput for every published baseline.</desc>
  <style>
    :root { color-scheme: light dark; }
    text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; font-size: 12px; }
    .title { font-size: 18px; font-weight: 600; }
    .subtitle, .tick { fill: #57606a; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .axis { stroke: #8c959f; stroke-width: 1; }
    .series { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .marker { stroke: #ffffff; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      text { fill: #f0f6fc; }
      .subtitle, .tick { fill: #8c959f; }
      .grid { stroke: #30363d; }
      .axis { stroke: #6e7681; }
      .marker { stroke: #0d1117; }
    }
  </style>
  <text class="title" x="220" y="28">20-minute concurrency-8 soak throughput</text>
  <text class="subtitle" x="220" y="50">Aggregate output tokens per second; all published runs completed with zero errors</text>
  <line class="grid" x1="220.0" y1="86" x2="220.0" y2="210"/>
  <text class="tick" x="220.0" y="234" text-anchor="middle">0</text>
  <line class="grid" x1="352.8" y1="86" x2="352.8" y2="210"/>
  <text class="tick" x="352.8" y="234" text-anchor="middle">50</text>
  <line class="grid" x1="485.6" y1="86" x2="485.6" y2="210"/>
  <text class="tick" x="485.6" y="234" text-anchor="middle">100</text>
  <line class="grid" x1="618.4" y1="86" x2="618.4" y2="210"/>
  <text class="tick" x="618.4" y="234" text-anchor="middle">150</text>
  <line class="grid" x1="751.2" y1="86" x2="751.2" y2="210"/>
  <text class="tick" x="751.2" y="234" text-anchor="middle">200</text>
  <line class="grid" x1="884.0" y1="86" x2="884.0" y2="210"/>
  <text class="tick" x="884.0" y="234" text-anchor="middle">250</text>
  <text x="208" y="118" text-anchor="end">Qwen3.8 NVFP4</text>
  <rect x="220" y="98" width="418.6" height="28" rx="3" fill="#2563eb"><title>157.61 output tok/s</title></rect>
  <text x="648.6" y="118">157.61</text>
  <text x="208" y="180" text-anchor="end">GLM-5.3 EXL3</text>
  <rect x="220" y="160" width="102.3" height="28" rx="3" fill="#dc2626"><title>38.53 output tok/s</title></rect>
  <text x="332.3" y="180">38.53</text>
  <text x="552.0" y="254" text-anchor="middle">Aggregate output throughput (tokens/s)</text>
</svg>
